[project]
name = "tomo-sftf"
version = "0.1.0"
description = "Support Flow Tensor Field (SFTF) - fast build-orientation candidate generator for additive manufacturing (core engine)"
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps of the SHIPPED engine package (SupportFlowTensorField) ONLY.
# The engine imports just numpy + trimesh (+ embreex/rtree/scipy for ray casting and
# trimesh's spatial ops). Everything else core's own scripts use lives in the
# [dependency-groups] below so it is NOT pulled into projects that depend on tomo-sftf.
dependencies = [
    "numpy==1.26.4",
    "trimesh==4.4.0",
    "embreex>=4.4.0",
    "rtree>=1.2.0",
    "scipy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# import 스타일이 `import SupportFlowTensorField` 인 경우 (권장 가정):
packages = ["python_src/SupportFlowTensorField"]
# 만약 코드가 `import python_src.SupportFlowTensorField` 로 임포트한다면 위를 지우고:
#   packages = ["python_src"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
# Tooling used by core's OWN scripts (plots, viz, PDF) -- NOT by the shipped engine and
# NOT propagated to dependents (groups are dev-only). Installed for core's local dev via
# default-groups below. Removed entirely: graphifyy (0 uses), perl (mistaken dep).
tooling = [
    "colorama>=0.4.6",
    "matplotlib>=3.10.0",
    "plotly>=6.0.0",
    "polyscope>=2.4.0",
    "pymupdf>=1.27.2.3",
    "scikit-learn>=1.5.0",
    "manifold3d>=3.5.1",
]
# Dataset loader for a single script; thingi10k[clip] drags in torch/torchvision/open_clip
# (multi-GB). Kept OUT of default-groups so neither dependents nor a default `uv sync`
# install it. Opt in for that script with:  uv run --group datasets python <script>.
datasets = [
    "thingi10k[clip]>=1.4.0",
]

[tool.uv]
# core's own `uv sync` still gets its scripting tools (but not the torch-heavy datasets group).
default-groups = ["dev", "tooling"]
